services:
  careassist:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # copiez .env.example en .env pour configurer
    environment:
      DB_PATH: /app/data/careassist.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
