<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CareAssist — Tableau de bord</title>
  <meta name="description" content="Ne manquez plus jamais un rendez-vous. Votre réceptionniste IA 24/7 pour les professionnels de santé." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=8" />
  <style>
    body{background:var(--bg)}
    .admin-head{background:#0b1726;color:#fff;padding:22px 0}
    .admin-head .container{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .admin-head p{margin:.2em 0 0;color:#9fb3c8;font-size:.92rem}
    .admin-head .logo{color:#fff}
    .stats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin:24px 0}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
    .stat span{color:var(--muted);font-size:.8rem;display:block}.stat strong{font-size:1.6rem}
    .stat.red strong{color:var(--danger)}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
    .tabs button{background:none;border:none;padding:.8em 1.1em;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:.45em;align-items:center;font-size:.95rem}
    .tabs button.active{color:var(--brand-ink);border-color:var(--brand)}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.9rem}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:#f3f7fa;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
    tr.click{cursor:pointer}tr.click:hover td{background:#f5fbfb}
    .badge{display:inline-block;padding:.15em .55em;border-radius:6px;font-size:.75rem;font-weight:700}
    .b-vital{background:#fee2e2;color:#b91c1c}.b-urgent{background:#ffedd5;color:#c2410c}.b-none{background:#eef2f7;color:#64748b}
    .b-ok{background:#dcfce7;color:#166534}.b-pending{background:#fef9c3;color:#854d0e}.b-mock{background:#ffedd5;color:#9a3412}.b-live{background:#dbeafe;color:#1e40af}.b-cancel{background:#f1f5f9;color:#64748b;text-decoration:line-through}
    .layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
    .detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;max-height:640px;overflow:auto}
    .detail .bubble{font-size:.88rem}.meta{font-size:.72rem;color:var(--muted);margin:-4px 0 6px}
    .empty{color:var(--muted);text-align:center;padding:30px}
    .toolbar{display:flex;gap:10px;align-items:center}
    .toolbar select{padding:.5em;border-radius:10px;border:1px solid #334155;background:#13243a;color:#fff}
    @media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="admin-head">
  <div class="container">
    <div>
      <span class="logo"><span class="logo-mark"><svg class="i" data-icon="plus"></svg></span> CareAssist · Tableau de bord</span>
      <p>Ne manquez plus jamais un rendez-vous. Votre réceptionniste IA 24/7 pour les professionnels de santé.</p>
    </div>
    <div class="toolbar">
      <select id="f-practice"><option value="">Tous les cabinets</option></select>
      <button class="btn btn-primary btn-sm" id="refresh"><svg class="i" data-icon="refresh"></svg> Actualiser</button>
      <a class="btn btn-outline btn-sm" href="./"><svg class="i" data-icon="arrowLeft"></svg> Site</a>
    </div>
  </div>
</header>
<main class="container">
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button data-tab="conversations" class="active"><svg class="i" data-icon="message"></svg> Conversations</button>
    <button data-tab="appointments"><svg class="i" data-icon="calendar"></svg> Rendez-vous</button>
    <button data-tab="emergencies"><svg class="i" data-icon="alert"></svg> Urgences</button>
    <button data-tab="leads"><svg class="i" data-icon="inbox"></svg> Leads</button>
    <button data-tab="subscriptions"><svg class="i" data-icon="card"></svg> Abonnements</button>
    <button data-tab="practices"><svg class="i" data-icon="globe"></svg> Cabinets</button>
  </div>
  <div id="panel"></div>
  <p class="note">Données de démonstration. Accès protégé par ADMIN_TOKEN (obligatoire en production), HTTPS et hébergement HDS recommandés.</p>
</main>
<script src="icons.js?v=4"></script>
<script src="admin.js?v=5"></script>
</body>
</html>
